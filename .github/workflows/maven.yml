# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [8, 11, 17, 21, 25]

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK ${{ matrix.java-version }} for the tests
      id: test-jdk
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
    - name: Set up JDK 21 for the build
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'temurin'
        cache: maven
    - name: Build and test on Java ${{ matrix.java-version }}
      run: mvn -B verify --file pom.xml -Djib.it.java=${{ steps.test-jdk.outputs.path }}/bin/java
